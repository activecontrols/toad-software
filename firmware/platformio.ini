; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
framework = arduino

monitor_speed = 57600
monitor_echo = yes
monitor_filters = 
  send_on_enter
  log2file

build_unflags =
  -Os                ; don't compile for size

build_flags =
  -D SERIAL_RX_BUFFER_SIZE=1024 ; increase serial buffer size
  -D SERIAL_TX_BUFFER_SIZE=1024
  -Wl,-u,_printf_float
  -Wl,-u,_scanf_float
  -D USBCON
  -D USBD_USE_CDC
  -D RADIO_BAUD=57600  ; used on all Serial interfaces for consistency, see monitor_speed above
  -O3                  ; compile for speed
  

[env:flight_controller]
; TODO - add DFU support, and "upload over CAN" if we are feeling clever.
board = TOAD_H7 ; for now these are the same for EC and FC - we can split if needed

build_flags = 
  ${env.build_flags}
  -D TOAD_FLIGHT_CONTROLLER_ONLY

build_src_filter =
  -<**/*.cpp>
  +<**/fc_**.cpp>

[env:engine_controller]
board = TOAD_H7

build_flags = 
  ${env.build_flags}
  -D TOAD_ENGINE_CONTROLLER_ONLY

build_src_filter =
  -<**/*.cpp>
  +<**/ec_**.cpp>

[env:programmer]
board = TOAD_G4

build_flags = 
  ${env.build_flags}
  -D TOAD_PROGRAMMER_ONLY

build_src_filter =
  -<**/*.cpp>
  +<**/prog_**.cpp>

[env:esp32]
platform = espressif32
board = esp32dev

build_flags = 
  ${env.build_flags}
  -DDEVICE_ESP32

build_src_filter =
  -<**/*.cpp>
  +<**/esp32_**.cpp>
