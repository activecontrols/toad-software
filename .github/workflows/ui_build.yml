name: Windows UI Build

on: [push]
  
jobs:
  build-ui:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSYS2 (MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Debug - list workspace contents
        shell: cmd
        run: |
          echo Current directory:
          cd
          echo.
          echo Contents of workspace:
          dir
          echo.
          echo PATH is:
          echo %PATH%
          echo.
          echo Checking for UI.mk:
          if exist UI.mk (echo UI.mk found) else (echo UI.mk NOT FOUND)
          echo.
          echo Checking mingw32-make on PATH:
          where mingw32-make
          echo ucrt64:
          cd C:\msys64\ucrt64\bin; dir
          echo msys64 mingw64:
          cd C:\msys64\mingw64\bin; dir
          echo mingw64:
          cd C:\mingw64\bin\; dir

      - name: Build UI with mingw32-make
        shell: cmd
        run: |
          mingw32-make -f UI.mk

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: toad-ui
          path: |
            UI/imgui/misc/fonts/Cousine-Regular.ttf
            UI/app.exe
